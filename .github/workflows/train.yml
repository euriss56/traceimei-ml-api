name: Train TraceIMEI Model v2.2

on:
  workflow_dispatch:  # Lancement manuel depuis GitHub

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install scikit-learn joblib numpy pandas

      - name: Entraîner le modèle
        run: |
          python train_model.py

      - name: Commit et push le modèle
        run: |
          git config user.email "fanoueuriss@gmail.com"
          git config user.name "euriss56"
          git add traceimei_model.pkl model_metrics.json
          git commit -m "🤖 Auto-train v2.2 : modèle 5 features"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
